services:
  web:
    image: chsiegel/eduavatars:frontend
    pull_policy: always
    env_file: ../.env
    # Same user as the backend's files (see PUID/PGID in .env.example), so Caddy can read the
    # speech recognition model even on storage that only grants access to that user/group, like a
    # TrueNAS dataset — any other user would get 403 for every model file.
    user: "${PUID:-568}:${PGID:-568}"
    ports:
      - "30080:80"
    depends_on:
      # Waits for the backend to actually answer /health, not just for its container to have
      # started — Caddy is otherwise ready to route to a backend that isn't up yet.
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Checks Caddy's own SPA index, not the backend (see backend's own healthcheck below) — a
      # slow/unhealthy backend shouldn't make an orchestrator restart Caddy, which wouldn't fix it.
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # On-device speech recognition model, served by Caddy at /models/ (see Caddyfile). Filled by
      # the stt-model service below.
      - ${EDUAVATARS_DATA_DIR}/models:/models:ro

  # Downloads the on-device speech recognition model into the data directory, then exits (see
  # scripts/fetch-stt-model.sh). Runs on every `up`, but only downloads what's missing or damaged,
  # so after the first run it finishes in seconds. `web` deliberately doesn't wait for it: the
  # site is up right away, and browsers use server transcription until the model is complete.
  stt-model:
    image: chsiegel/eduavatars:frontend
    pull_policy: always
    entrypoint: ["fetch-stt-model", "/models"]
    user: "${PUID:-568}:${PGID:-568}"
    depends_on:
      # The backend's entrypoint creates models/ and hands it to PUID:PGID — before that, this
      # user may not be allowed to write there.
      backend:
        condition: service_healthy
    volumes:
      - ${EDUAVATARS_DATA_DIR}/models:/models
    restart: "no"

  # Optional local text-to-speech (see local-tts/): speech output without a cloud key, including
  # voices cloned from teachers' own clips (Dashboard → Voices). Only started with the
  # "local-tts" profile — set COMPOSE_PROFILES=local-tts and LOCAL_TTS_ENABLED=true in .env (see
  # docker/README.md). Needs a few GB of RAM and plenty of CPU; nothing else depends on it.
  tts-local:
    image: chsiegel/eduavatars:local-tts
    pull_policy: always
    profiles: ["local-tts"]
    env_file: ../.env
    environment:
      TTS_MODEL_CACHE_DIR: /data/model-cache
      # Optional default voices, one <language>.wav each (see local-tts/voices/README.md) — used
      # by projects that haven't picked a voice clip.
      TTS_VOICES_DIR: /data/voices
      # Only a cache: the backend re-sends a teacher's clip whenever it's missing here.
      TTS_CUSTOM_VOICES_DIR: /data/custom-voices
    volumes:
      - ${EDUAVATARS_DATA_DIR}/local-tts:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional knowledge base (RAG, see rag/ and docs/rag-plan.md): teachers upload their own
  # material and the avatar's answers are grounded in it, with any LLM provider. Only started with
  # the "rag" profile — set COMPOSE_PROFILES=rag, RAG_ENABLED=true and RAG_SERVICE_TOKEN in .env
  # (see docker/README.md). Publishes no port: only the backend talks to it, with the shared token.
  rag:
    image: chsiegel/eduavatars:rag
    pull_policy: always
    profiles: ["rag"]
    env_file: ../.env
    # Started directly as the data directory's owner (no root entrypoint), with a read-only root
    # filesystem and no capabilities: this container parses untrusted uploads.
    user: "${PUID:-568}:${PGID:-568}"
    environment:
      RAG_DATA_DIR: /data
      RAG_MODEL_CACHE_DIR: /data/model-cache
      HF_HOME: /data/model-cache/huggingface
      HOME: /tmp
    volumes:
      - ${EDUAVATARS_DATA_DIR}/rag:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    depends_on:
      # The backend's entrypoint creates rag/ in the data directory and hands it to PUID:PGID —
      # before that, Docker would create it as root and this user couldn't write there.
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional quality evaluation of the knowledge base (Ragas, see rag-eval/): scores the avatar's
  # answers to test questions and drafts test questions from the material, using one of the
  # teacher's own LLM keys as judge. Only started with the "rag-eval" profile next to "rag" — set
  # COMPOSE_PROFILES=rag,rag-eval and RAG_EVALUATION_ENABLED=true in .env. Publishes no port.
  rag-eval:
    image: chsiegel/eduavatars:rag-eval
    pull_policy: always
    profiles: ["rag-eval"]
    # Only the shared token, not the whole .env: this container needs none of the backend's
    # secrets, and the judge's key arrives per request.
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      RAG_SERVICE_URL: http://rag:8090
      RAG_EVAL_DATA_DIR: /data
      RAG_EVAL_CONCURRENCY: ${RAG_EVAL_CONCURRENCY:-4}
      RAG_EVAL_LLM_TIMEOUT_SECONDS: ${RAG_EVAL_LLM_TIMEOUT_SECONDS:-120}
      RAGAS_DO_NOT_TRACK: "true"
      HOME: /tmp
    user: "${PUID:-568}:${PGID:-568}"
    volumes:
      - ${EDUAVATARS_DATA_DIR}/rag-eval:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    depends_on:
      # The backend's entrypoint creates rag-eval/ in the data directory (see the rag service).
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional layout-aware document parsing for the knowledge base: tables, multi-column pages and
  # OCR for scanned PDFs. A large image (PyTorch, several GB) — only started with the "docling"
  # profile next to "rag", and only used once DOCLING_URL=http://docling:5001 is set in .env.
  # Check the tag against https://github.com/docling-project/docling-serve/releases before
  # deploying; override with DOCLING_SERVE_IMAGE.
  docling:
    image: ${DOCLING_SERVE_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.36.0}
    profiles: ["docling"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      # Longer than the default, so a long PDF finishes in one synchronous request.
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g
    restart: unless-stopped

  backend:
    image: chsiegel/eduavatars:backend
    pull_policy: always
    env_file: ../.env
    environment:
      DATABASE_URL: sqlite:////data/eduavatars.db
      AVATAR_UPLOAD_DIR: /data/uploads/avatars
      PROFILE_PICTURE_UPLOAD_DIR: /data/uploads/profile-pictures
      AVATAR_THUMBNAIL_UPLOAD_DIR: /data/uploads/avatar-thumbnails
      BACKGROUND_UPLOAD_DIR: /data/uploads/backgrounds
      START_AUDIO_UPLOAD_DIR: /data/uploads/start-audio

      # --- Production, behind Caddy/HTTPS ---
      COOKIE_SECURE: "true"
      ENVIRONMENT: production
      REGISTRATION_ENABLED: "true"

      # Which senders may set X-Forwarded-For, i.e. which hops in front of this container are
      # trusted to report the real visitor address (see --proxy-headers in docker/backend.Dockerfile).
      # Everything ahead of the backend — Caddy, and cloudflared if it runs as a container — sits on
      # a private network, while real visitors arrive from public addresses; uvicorn walks the
      # X-Forwarded-For chain from the right and takes the first address NOT listed here, which is
      # exactly the visitor. Overridable from .env for a tighter range.
      #
      # Do NOT set this to "*": that switches uvicorn to taking the LEFTMOST entry of the chain,
      # which is the part a visitor can write themselves — every per-IP rate limit would then be
      # bypassable by sending a made-up X-Forwarded-For header.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}

      STT_MODEL_CACHE_DIR: /data/whisper-cache
      VOICE_CLIP_UPLOAD_DIR: /data/uploads/voice-clips
      # Only used with STT_ENGINE=parakeet: the same files the stt-model service downloads for
      # the browsers.
      STT_PARAKEET_MODEL_DIR: /data/models/parakeet-redux/v1

      # --- Admin bootstrap, optional — creates/promotes this account to admin on startup, see
      #     backend/app/cli/bootstrap_admin.py. Safe to leave unset (no admin gets created) or to
      #     leave set indefinitely (idempotent). Set ADMIN_EMAIL/ADMIN_PASSWORD in the root .env.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # --- SMTP (password-reset emails), optional — without SMTP_HOST the reset flow is a silent
      #     no-op, see backend/app/features/auth/email.py. Set SMTP_HOST/PORT/USERNAME/PASSWORD/
      #     FROM_ADDRESS in the root .env if needed (see .env.example). ---

      # --- Defaults from Settings, usually leave unchanged ---
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: "30"
    volumes:
      # This is the one value that genuinely needs ${VAR} substitution while the YAML itself is
      # being parsed (volume sources can't come from env_file, unlike plain environment variables).
      - ${EDUAVATARS_DATA_DIR}:/data
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl/wget — urllib is stdlib, so this needs no extra dependency.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
