<svg width="1040" height="760" viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <!-- Client boxes -->
  <rect x="80" y="30" width="380" height="60" rx="10" fill="#e7edf6" stroke="#5b7fa6" stroke-width="2"/>
  <text x="270" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#2c435d">Teacher's browser</text>
  <text x="270" y="76" text-anchor="middle" font-size="14" fill="#33404f">dashboard: create &amp; manage projects</text>

  <rect x="580" y="30" width="380" height="60" rx="10" fill="#e7edf6" stroke="#5b7fa6" stroke-width="2"/>
  <text x="770" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#2c435d">Visitor's browser</text>
  <text x="770" y="76" text-anchor="middle" font-size="14" fill="#33404f">public chat: talks to a published avatar</text>

  <line x1="270" y1="90" x2="270" y2="148" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="90" x2="770" y2="148" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Caddy -->
  <rect x="140" y="150" width="760" height="90" rx="10" fill="#fdf1de" stroke="#c98a2e" stroke-width="2"/>
  <text x="520" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#8a5a12">Caddy — reverse proxy ("web" container)</text>
  <text x="520" y="200" text-anchor="middle" font-size="14" fill="#33404f">Routes "/api/*" to the backend, serves the built frontend (React single-page app) for everything else</text>
  <text x="520" y="220" text-anchor="middle" font-size="14" fill="#33404f">TLS is terminated upstream (e.g. a Cloudflare Tunnel) — Caddy itself speaks plain HTTP</text>

  <line x1="520" y1="240" x2="520" y2="298" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="270" y="300" width="500" height="190" rx="10" fill="#e6f4ea" stroke="#3f8a53" stroke-width="2"/>
  <text x="520" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6b34">Backend — FastAPI (Python), "backend" container</text>
  <text x="300" y="356" font-size="14" fill="#33404f">• Auth: JWT (JSON Web Tokens) + bcrypt password hashing</text>
  <text x="300" y="380" font-size="14" fill="#33404f">• Projects, avatar library, background library</text>
  <text x="300" y="404" font-size="14" fill="#33404f">• Public chat: LLM reply, text-to-speech, and speech-to-text</text>
  <text x="300" y="428" font-size="14" fill="#33404f">  (faster-whisper runs in-process, no separate service)</text>
  <text x="300" y="452" font-size="14" fill="#33404f">• Analytics and admin (site settings, user management)</text>
  <text x="300" y="476" font-size="14" fill="#33404f">• Rate limiting on every public endpoint</text>

  <line x1="400" y1="490" x2="290" y2="538" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="490" x2="750" y2="538" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Data store -->
  <rect x="60" y="540" width="430" height="110" rx="10" fill="#f1eef8" stroke="#7a5fb0" stroke-width="2"/>
  <text x="275" y="568" text-anchor="middle" font-size="17" font-weight="700" fill="#4d3884">SQLite database + uploaded files</text>
  <text x="275" y="592" text-anchor="middle" font-size="14" fill="#33404f">Users, projects, conversations, API keys</text>
  <text x="275" y="612" text-anchor="middle" font-size="14" fill="#33404f">Avatar models, background images, intro audio</text>
  <text x="275" y="634" text-anchor="middle" font-size="13" fill="#5b6577">On disk at EDUAVATARS_DATA_DIR (Docker) or backend/ (local dev)</text>

  <!-- External providers -->
  <rect x="550" y="540" width="430" height="110" rx="10" fill="#fdeaea" stroke="#c1443f" stroke-width="2"/>
  <text x="765" y="568" text-anchor="middle" font-size="17" font-weight="700" fill="#96302c">External AI providers (over HTTPS)</text>
  <text x="765" y="592" text-anchor="middle" font-size="14" fill="#33404f">Anthropic · OpenAI · Google Gemini · Ollama /</text>
  <text x="765" y="612" text-anchor="middle" font-size="14" fill="#33404f">self-hosted · Cartesia · Google Cloud TTS</text>
  <text x="765" y="634" text-anchor="middle" font-size="13" fill="#5b6577">GWDG Arcana (adds retrieval-augmented generation)</text>

  <!-- Footnote -->
  <text x="520" y="700" text-anchor="middle" font-size="13.5" fill="#5b6577">Local development skips Caddy: Vite's dev server serves the frontend directly at localhost:5173</text>
  <text x="520" y="720" text-anchor="middle" font-size="13.5" fill="#5b6577">and proxies "/api/*" straight to the backend at localhost:8000.</text>
</svg>
