name: Build and Publish Docker Images to Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Dummy values, valid enough to pass app/core/config.py's startup checks — never used for
    # anything real. The shared root .env (real secrets) is gitignored and isn't present here.
    env:
      JWT_SECRET: ci-test-only-W1zjYoC7I4MjZalXID7Jof5UNnXtnc-nwnNQ6bQeEigpjqkcvpPam63bMYwWHzrw
      API_KEY_ENCRYPTION_SECRET: fYiWjeCc-F4eXts_g5lOyKoI3CNbtu2eA83s-aNdMpo=
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend package + test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="chsiegel/eduavatars:${{ matrix.component }}"
          TAGS="$TAGS,chsiegel/eduavatars:${{ matrix.component }}-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,chsiegel/eduavatars:${{ matrix.component }}-${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
